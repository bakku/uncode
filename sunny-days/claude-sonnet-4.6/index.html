<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunny Days Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #4f8ef7 0%, #7c4dff 100%);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      color: #1a1a2e;
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
    }

    /* Header */
    .hero {
      text-align: center;
      color: #fff;
      margin-bottom: 2rem;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      opacity: 0.88;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    }

    /* Search */
    .search-wrap {
      position: relative;
      margin-bottom: 0;
    }
    .search-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 0.5rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .search-row {
      display: flex;
      gap: 0.75rem;
    }
    .search-input {
      flex: 1;
      padding: 0.9rem 1.1rem;
      font-size: 1rem;
      border: 2px solid #e3e3e8;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      background: #fafafa;
      color: #1a1a2e;
    }
    .search-input:focus {
      border-color: #4f8ef7;
      box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.15);
      background: #fff;
    }
    .search-btn {
      padding: 0.9rem 1.4rem;
      background: linear-gradient(135deg, #4f8ef7, #7c4dff);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.18s, transform 0.1s;
    }
    .search-btn:hover { opacity: 0.9; }
    .search-btn:active { transform: scale(0.97); }
    .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Autocomplete */
    .dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #e3e3e8;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      z-index: 200;
      overflow: hidden;
    }
    .dropdown.open { display: block; }
    .dropdown-item {
      padding: 0.75rem 1.1rem;
      cursor: pointer;
      transition: background 0.1s;
      border-bottom: 1px solid #f0f0f0;
    }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover, .dropdown-item.focused { background: #f4f6ff; }
    .dropdown-item .loc-name { font-weight: 600; font-size: 0.97rem; }
    .dropdown-item .loc-sub { font-size: 0.82rem; color: #777; margin-top: 1px; }

    /* Divider */
    .divider {
      height: 1px;
      background: #f0f0f0;
      margin: 1.75rem 0;
    }

    /* Loading */
    .loading { display: none; text-align: center; padding: 2.5rem 0; }
    .loading.on { display: block; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #eee;
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-msg { color: #666; font-size: 0.97rem; }
    .loading-step {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
    }
    .step { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #aaa; }
    .step.done { color: #22c55e; }
    .step.active { color: #4f8ef7; font-weight: 600; }
    .step-icon { font-size: 1rem; }

    /* Results */
    .results { display: none; }
    .results.on { display: block; }

    .results-head {
      margin-bottom: 1.25rem;
    }
    .results-head h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a2e;
    }
    .results-head h2 span { color: #4f8ef7; }
    .results-meta {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.3rem;
    }

    /* Empty */
    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .empty-state p { color: #555; line-height: 1.6; }
    .empty-state .note { font-size: 0.85rem; color: #999; margin-top: 0.5rem; }

    /* Month groups */
    .month-group { margin-bottom: 1.5rem; }
    .month-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #7c4dff;
      margin-bottom: 0.6rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #f0ecff;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.5rem;
    }

    .day-tile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #f8faff;
      border: 1px solid #e8edff;
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .day-tile:hover {
      box-shadow: 0 2px 12px rgba(79,142,247,0.12);
      border-color: #b8ccff;
    }
    .day-emoji { font-size: 1.4rem; flex-shrink: 0; }
    .day-body { flex: 1; min-width: 0; }
    .day-name { font-weight: 700; font-size: 0.95rem; color: #1a1a2e; }
    .day-wdays { font-size: 0.78rem; color: #777; margin-top: 0.15rem; line-height: 1.5; }
    .day-wdays strong { color: #333; }

    /* Weekend highlight */
    .day-tile.weekend { background: #fff8f0; border-color: #ffd6a0; }
    .day-tile.weekend:hover { border-color: #ffb347; }

    /* Summary bar */
    .summary-bar {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      background: #f4f6ff;
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 1.5rem;
    }
    .stat { text-align: center; }
    .stat-val { font-size: 1.5rem; font-weight: 800; color: #4f8ef7; }
    .stat-lbl { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Error */
    .error-box {
      background: #fff5f5;
      border: 1px solid #ffc8c8;
      border-radius: 10px;
      padding: 1.25rem;
      color: #c53030;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* Legend */
    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #f0f0f0;
      font-size: 0.8rem;
      color: #999;
    }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .sw-sun { background: #f8faff; border: 1px solid #e8edff; }
    .sw-wknd { background: #fff8f0; border: 1px solid #ffd6a0; }

    @media (max-width: 520px) {
      .card { padding: 1.25rem; }
      .search-row { flex-direction: column; }
      .days-grid { grid-template-columns: 1fr; }
      .summary-bar { gap: 1rem; justify-content: space-around; }
    }
  </style>
</head>
<body>
<div class="page">

  <header class="hero">
    <h1>☀️ Sunny Days Finder</h1>
    <p>Find the best rain-free days to host your event — wedding, feast, or celebration</p>
  </header>

  <div class="card">

    <!-- Search -->
    <div class="search-wrap" id="searchWrap">
      <label class="search-label" for="locationInput">Location</label>
      <div class="search-row">
        <input
          id="locationInput"
          class="search-input"
          type="text"
          placeholder="Type a city, town, or region…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="search-btn" id="analyzeBtn" disabled>Analyze</button>
      </div>
      <div class="dropdown" id="dropdown"></div>
    </div>

    <div class="divider" id="divider" style="display:none;"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-msg" id="loadingMsg">Starting…</div>
      <div class="loading-step">
        <div class="step" id="step1"><span class="step-icon">🌍</span> Locating coordinates</div>
        <div class="step" id="step2"><span class="step-icon">📡</span> Fetching 5 years of weather data</div>
        <div class="step" id="step3"><span class="step-icon">🔍</span> Analysing rainfall patterns</div>
        <div class="step" id="step4"><span class="step-icon">✅</span> Building results</div>
      </div>
    </div>

    <!-- Results -->
    <div class="results" id="results">
      <div class="results-head">
        <h2>Rain-free days near <span id="locationName">—</span></h2>
        <div class="results-meta" id="resultsMeta"></div>
      </div>
      <div id="resultsBody"></div>
    </div>

  </div>
</div>

<script>
  // ── DOM refs ──────────────────────────────────────────────────────────────
  const locationInput = document.getElementById('locationInput');
  const analyzeBtn    = document.getElementById('analyzeBtn');
  const dropdown      = document.getElementById('dropdown');
  const divider       = document.getElementById('divider');
  const loadingEl     = document.getElementById('loading');
  const loadingMsg    = document.getElementById('loadingMsg');
  const resultsEl     = document.getElementById('results');
  const locationName  = document.getElementById('locationName');
  const resultsMeta   = document.getElementById('resultsMeta');
  const resultsBody   = document.getElementById('resultsBody');

  const STEP_ELS = [1,2,3,4].map(i => document.getElementById('step' + i));

  // ── State ─────────────────────────────────────────────────────────────────
  let suggestions     = [];
  let selectedLoc     = null;
  let focusedIdx      = -1;
  let searchTimer     = null;

  // ── Autocomplete ──────────────────────────────────────────────────────────
  locationInput.addEventListener('input', () => {
    const q = locationInput.value.trim();
    selectedLoc = null;
    analyzeBtn.disabled = true;
    clearTimeout(searchTimer);
    if (q.length < 2) { closeDropdown(); return; }
    searchTimer = setTimeout(() => fetchSuggestions(q), 280);
  });

  locationInput.addEventListener('keydown', e => {
    const items = dropdown.querySelectorAll('.dropdown-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      focusedIdx = Math.min(focusedIdx + 1, items.length - 1);
      syncFocus(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      focusedIdx = Math.max(focusedIdx - 1, 0);
      syncFocus(items);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (focusedIdx >= 0 && suggestions[focusedIdx]) {
        pickLocation(suggestions[focusedIdx]);
      } else if (selectedLoc) {
        runAnalysis();
      }
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  });

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('#searchWrap')) closeDropdown();
  });

  analyzeBtn.addEventListener('click', runAnalysis);

  function syncFocus(items) {
    items.forEach((el, i) => el.classList.toggle('focused', i === focusedIdx));
    if (focusedIdx >= 0) items[focusedIdx]?.scrollIntoView({ block: 'nearest' });
  }

  async function fetchSuggestions(query) {
    try {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=7&language=en&format=json`;
      const r = await fetch(url);
      const d = await r.json();
      suggestions = d.results || [];
      renderDropdown();
    } catch {
      suggestions = [];
      closeDropdown();
    }
  }

  function renderDropdown() {
    if (!suggestions.length) { closeDropdown(); return; }
    dropdown.innerHTML = suggestions.map((loc, i) => {
      const sub = [loc.admin1, loc.country].filter(Boolean).join(', ');
      return `
        <div class="dropdown-item" data-i="${i}">
          <div class="loc-name">${escHtml(loc.name)}</div>
          ${sub ? `<div class="loc-sub">${escHtml(sub)}</div>` : ''}
        </div>`;
    }).join('');
    dropdown.querySelectorAll('.dropdown-item').forEach((el, i) => {
      el.addEventListener('pointerdown', ev => { ev.preventDefault(); pickLocation(suggestions[i]); });
      el.addEventListener('mouseenter', () => { focusedIdx = i; syncFocus(dropdown.querySelectorAll('.dropdown-item')); });
    });
    focusedIdx = -1;
    dropdown.classList.add('open');
  }

  function closeDropdown() {
    dropdown.classList.remove('open');
    focusedIdx = -1;
  }

  function pickLocation(loc) {
    selectedLoc = loc;
    const label = [loc.name, loc.admin1, loc.country].filter(Boolean).join(', ');
    locationInput.value = label;
    analyzeBtn.disabled = false;
    closeDropdown();
  }

  // ── Analysis ──────────────────────────────────────────────────────────────
  async function runAnalysis() {
    if (!selectedLoc) return;
    analyzeBtn.disabled = true;

    // Show loading
    resultsEl.classList.remove('on');
    divider.style.display = 'block';
    loadingEl.classList.add('on');
    setStep(1, 'active');

    try {
      // Step 1: coords already known from geocoding
      await tick();
      setStep(1, 'done'); setStep(2, 'active');
      loadingMsg.textContent = 'Fetching 5 years of precipitation data…';

      const START = '2020-01-01';
      const END   = '2024-12-31';
      const { latitude: lat, longitude: lon } = selectedLoc;

      const weatherUrl = `https://archive-api.open-meteo.com/v1/archive`
        + `?latitude=${lat}&longitude=${lon}`
        + `&start_date=${START}&end_date=${END}`
        + `&daily=precipitation_sum`
        + `&timezone=UTC`;

      const resp = await fetch(weatherUrl);
      if (!resp.ok) throw new Error(`Weather API returned ${resp.status}.`);
      const weather = await resp.json();

      setStep(2, 'done'); setStep(3, 'active');
      loadingMsg.textContent = 'Analysing rainfall for each calendar day…';
      await tick();

      const rainFree = findRainFreeDays(weather);

      setStep(3, 'done'); setStep(4, 'active');
      loadingMsg.textContent = 'Building your results…';
      await tick();

      setStep(4, 'done');
      loadingEl.classList.remove('on');
      showResults(selectedLoc, rainFree, 2020, 2024);

    } catch (err) {
      loadingEl.classList.remove('on');
      resultsEl.classList.add('on');
      locationName.textContent = selectedLoc.name;
      resultsMeta.textContent = '';
      resultsBody.innerHTML = `
        <div class="error-box">
          <strong>Something went wrong.</strong><br>
          ${escHtml(err.message)}<br>
          <span style="font-size:0.82rem;color:#e07070;">Please check your connection and try again.</span>
        </div>`;
    }

    analyzeBtn.disabled = false;
  }

  function setStep(n, state) {
    const el = STEP_ELS[n - 1];
    el.className = 'step ' + state;
  }

  function tick() {
    return new Promise(r => setTimeout(r, 60));
  }

  // ── Core logic ────────────────────────────────────────────────────────────
  function findRainFreeDays(weather) {
    const times  = weather.daily.time;
    const precip = weather.daily.precipitation_sum;

    // key: "MM-DD" → { data: number, rain: number }
    const map = Object.create(null);

    for (let i = 0; i < times.length; i++) {
      const t = times[i];                          // "YYYY-MM-DD"
      const key = t.slice(5);                      // "MM-DD"
      if (!map[key]) map[key] = { data: 0, rain: 0 };
      const p = precip[i];
      if (p !== null && p !== undefined && !isNaN(p)) {
        map[key].data++;
        if (p > 0) map[key].rain++;
      }
    }

    const MIN_YEARS = 4;
    const days = [];
    for (const key of Object.keys(map)) {
      const { data, rain } = map[key];
      if (rain === 0 && data >= MIN_YEARS) {
        const month = parseInt(key.slice(0, 2), 10);
        const day   = parseInt(key.slice(3), 10);
        days.push({ month, day, yearsWithData: data });
      }
    }

    days.sort((a, b) => a.month - b.month || a.day - b.day);
    return days;
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  const MONTH_NAMES = ['January','February','March','April','May','June',
                       'July','August','September','October','November','December'];
  const WDAY_NAMES  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function weekday(year, month, day) {
    return WDAY_NAMES[new Date(year, month - 1, day).getDay()];
  }

  function isValidDate(year, month, day) {
    const d = new Date(year, month - 1, day);
    return d.getFullYear() === year && d.getMonth() === month - 1 && d.getDate() === day;
  }

  function isWeekend(year, month, day) {
    const wd = new Date(year, month - 1, day).getDay();
    return wd === 0 || wd === 6;
  }

  function showResults(loc, days, startYear, endYear) {
    const locLabel = [loc.name, loc.admin1, loc.country].filter(Boolean).join(', ');
    locationName.textContent = locLabel;

    const CY = 2026, NY = 2027;
    const yearsSpan = endYear - startYear + 1;

    resultsEl.classList.add('on');

    if (days.length === 0) {
      resultsMeta.textContent = `Based on ${yearsSpan} years of data (${startYear}–${endYear})`;
      resultsBody.innerHTML = `
        <div class="empty-state">
          <div class="icon">🌧️</div>
          <p>
            No calendar day had <strong>zero</strong> recorded rainfall across all
            ${yearsSpan} years of data for this location.
          </p>
          <p class="note">
            This area receives at least some precipitation on every day of the year.
            Consider exploring a different location.
          </p>
        </div>`;
      return;
    }

    // Count how many fall on weekends in CY/NY
    let weekendsCY = 0, weekendsNY = 0;
    for (const d of days) {
      if (isValidDate(CY, d.month, d.day) && isWeekend(CY, d.month, d.day)) weekendsCY++;
      if (isValidDate(NY, d.month, d.day) && isWeekend(NY, d.month, d.day)) weekendsNY++;
    }

    resultsMeta.textContent = `${days.length} day${days.length !== 1 ? 's' : ''} with no recorded rainfall across ${yearsSpan} years (${startYear}–${endYear})`;

    // Summary bar
    let html = `
      <div class="summary-bar">
        <div class="stat"><div class="stat-val">${days.length}</div><div class="stat-lbl">Rain-free days</div></div>
        <div class="stat"><div class="stat-val">${weekendsCY}</div><div class="stat-lbl">Weekends in ${CY}</div></div>
        <div class="stat"><div class="stat-val">${weekendsNY}</div><div class="stat-lbl">Weekends in ${NY}</div></div>
        <div class="stat"><div class="stat-val">${yearsSpan}</div><div class="stat-lbl">Years analysed</div></div>
      </div>`;

    // Group by month
    const byMonth = new Map();
    for (const d of days) {
      if (!byMonth.has(d.month)) byMonth.set(d.month, []);
      byMonth.get(d.month).push(d);
    }

    for (const [month, mdays] of byMonth) {
      html += `<div class="month-group">
        <div class="month-label">${MONTH_NAMES[month - 1]}</div>
        <div class="days-grid">`;

      for (const d of mdays) {
        const validCY = isValidDate(CY, d.month, d.day);
        const validNY = isValidDate(NY, d.month, d.day);

        const wdCY = validCY ? weekday(CY, d.month, d.day) : null;
        const wdNY = validNY ? weekday(NY, d.month, d.day) : null;

        const wknd = (validCY && isWeekend(CY, d.month, d.day)) ||
                     (validNY && isWeekend(NY, d.month, d.day));

        const wdCYStr = wdCY
          ? `<strong>${wdCY.slice(0,3)}</strong>`
          : `<span style="opacity:0.5">–</span>`;
        const wdNYStr = wdNY
          ? `<strong>${wdNY.slice(0,3)}</strong>`
          : `<span style="opacity:0.5">–</span>`;

        html += `
          <div class="day-tile${wknd ? ' weekend' : ''}">
            <div class="day-emoji">${wknd ? '🎉' : '☀️'}</div>
            <div class="day-body">
              <div class="day-name">${MONTH_NAMES[d.month - 1]} ${d.day}</div>
              <div class="day-wdays">
                ${CY}: ${wdCYStr} &nbsp;·&nbsp; ${NY}: ${wdNYStr}
              </div>
            </div>
          </div>`;
      }

      html += `</div></div>`;
    }

    // Legend
    html += `
      <div class="legend">
        <div class="legend-item"><div class="legend-swatch sw-sun"></div> Weekday</div>
        <div class="legend-item"><div class="legend-swatch sw-wknd"></div> Includes a weekend (${CY} or ${NY})</div>
        <div class="legend-item" style="margin-left:auto;">Data: <a href="https://open-meteo.com" target="_blank" rel="noopener" style="color:#4f8ef7;">Open-Meteo</a></div>
      </div>`;

    resultsBody.innerHTML = html;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
